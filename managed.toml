[[harnesses]]
name = "claude"
source = "harnesses/claude"
target = ".claude"
links = ["CLAUDE.md", "statusline.py", "output-styles/proactive-concise.md"]
trees = []
# Apps and Claude Code rewrite settings.json, so it is a local file seeded from this one.
seeds = [{ source = "settings.json", target = "settings.json" }]

[[harnesses]]
name = "codex"
source = "harnesses/codex"
target = ".codex"
links = ["AGENTS.md"]
trees = []
seeds = [{ source = "config.toml.seed", target = "config.toml" }]

[[harnesses]]
name = "pi"
source = "harnesses/pi"
target = ".pi"
# `trees` owns package files and ordinary themes. `package_trees` augments the
# same package tree with node_modules links; keep each package tree in both
# lists so there is one package-file manager.
links = [
  "agent/AGENTS.md",
  "agent/SYSTEM.md",
  "agent/keybindings.json",
  "agent/xsettings.toml",
]
trees = ["agent/packages", "agent/themes"]
package_trees = ["agent/packages"]
# Pi rewrites agent/settings.json, so it is a local file seeded from this one.
seeds = [{ source = "agent/settings.json", target = "agent/settings.json" }]
