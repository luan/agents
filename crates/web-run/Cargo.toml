[package]
name = "web-run"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "web-run"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
chrono = "0.4"
crypto_box = { version = "0.9", features = ["seal"] }
ed25519-dalek = { version = "3", features = ["pkcs8"] }
futures-util = "0.3"
os_info = "3"
reqwest = { version = "0.13", default-features = false, features = ["cookies", "json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true

[dev-dependencies]
pretty_assertions = "1"
proptest = "1"
proptest-derive = "0.9"
rstest = "0.28"
