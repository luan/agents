[package]
name = "web-run"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "web_run"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
crypto_box = { version = "0.9", features = ["seal"] }
ed25519-dalek = { version = "2", features = ["pkcs8"] }
futures-util = "0.3"
os_info = "3"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true

[dev-dependencies]
pretty_assertions = "1"
proptest = "1"
proptest-derive = "0.6"
rstest = "0.26"
