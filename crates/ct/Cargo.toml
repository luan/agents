[package]
name = "ct"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ct"
path = "src/main.rs"

[[bin]]
name = "opencode"
path = "src/opencode.rs"

[dependencies]
anyhow = "^1"
clap = { version = "^4", features = ["derive"] }
clap_complete = "^4"
dirs = "^6"
image = "^0.25"
regex = "^1"
rmcp = { version = "^1", features = ["server", "macros", "transport-io"] }
rusqlite = { version = "^0.39", features = ["bundled"] }
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
sha1 = "^0.11"
similar = "^3"
sym = { path = "../sym" }
thiserror = "^2"
tokio = { version = "^1", features = ["rt", "macros", "io-std"] }

[dev-dependencies]
assert_cmd = "^2"
predicates = "^3"
tempfile = "^3"
