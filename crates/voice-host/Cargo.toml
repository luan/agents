[package]
name = "voice-host"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.23.1"
bytes = "1"
cpal = "0.18.2"
crossbeam-queue = "0.3"
opus = "0.4.0"
rand = "0.10"
rtc = "0.21.1"
rubato = { version = "=5.0.1", default-features = false }
sonora = { version = "=0.2.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
webrtc = "0.21.1"


[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["process"] }
rstest = "0.28"
pretty_assertions = "1"
proptest = "1"
