[package]
name = "notebook-host"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
hex = "0.4"
fs2 = "0.4"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "process", "net", "time"] }
uuid = { version = "1", features = ["v4"] }
zeromq = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
assert_fs = "1"
pretty_assertions = "1"
proptest = "1"
rstest = "0.26"

[lints]
workspace = true
