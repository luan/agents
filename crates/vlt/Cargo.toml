[package]
name = "vlt"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "vlt"
path = "src/main.rs"

[dependencies]
clap = { version = "^4", features = ["derive"] }
rmcp = { version = "^1", features = ["server", "macros", "transport-io"] }
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
tokio = { version = "^1", features = ["rt", "macros", "io-std"] }
rusqlite = { version = "^0.39", features = ["bundled"] }

[dev-dependencies]
assert_cmd = "^2"
predicates = "^3"
tempfile = "^3"
