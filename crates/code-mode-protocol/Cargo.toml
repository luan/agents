[package]
name = "code-mode-protocol"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
doctest = false

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "sync"] }
tokio-util = { version = "0.7.18", features = ["rt"] }

[dev-dependencies]
pretty_assertions = "1"
proptest = "1"
proptest-derive = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
