[package]
name = "apply-patch"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 AND MIT"
publish = false

[lib]
name = "codex_apply_patch"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "apply_patch"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22.1"
dirs = "6"
dunce = "1.0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2.7.0"
thiserror = "2.0.17"
tokio = { version = "1", features = ["macros", "rt"] }
url = "2"
urlencoding = "2.1"

[dev-dependencies]
assert_fs = "1"
assert_matches = "1"
pretty_assertions = "1"
proptest = "1"
proptest-derive = "0.6"
rstest = "0.26"
tempfile = "3.23.0"

[lints]
workspace = true
