[package]
name = "terminal-bridge"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "terminal-bridge"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
pty-process = "0.5.3"
rustix = { version = "1", features = ["event", "fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true

[dev-dependencies]
pretty_assertions = "1"
proptest = "1"
proptest-derive = "0.6"
rstest = "0.26"
