[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

[dev-dependencies]
assert_fs = "1"
pretty_assertions = "1"
predicates = "3"
proptest = "1"
proptest-derive = "0.9"
rstest = "0.28"
static_assertions = "1"

[lints]
workspace = true
