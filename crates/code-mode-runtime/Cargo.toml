[package]
name = "code-mode-runtime"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
doctest = false

[features]
sandbox = ["v8/v8_enable_sandbox"]

[dependencies]
code-mode-protocol = { path = "../code-mode-protocol" }
deno_core_icudata = "0.77.0"
futures = { version = "0.3", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tracing = "0.1.44"
v8 = "=149.2.0"

[dev-dependencies]
pretty_assertions = "1"
proptest = "1"
proptest-derive = "0.6"
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true
