name: publish
run-name: ${{ inputs.release_tag || github.ref_name }}

on:
  push:
    tags:
      - "@luan.sh/pi-*@*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Package tag to build (defaults to the selected Git ref)
        type: string
        required: false
      publish:
        description: Publish after building (disable for initial npm registration)
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag || github.ref }}

jobs:
  npm:
    name: Publish one Pi package to npm
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node and npm
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Install workspace
        run: bun install --frozen-lockfile

      - name: Test release selection
        run: bun test ./.github/scripts/publish-package.test.ts

      - name: Build package archive
        id: archive
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_ACTION: pack
        run: |
          archive="$(bash .github/scripts/publish-package.sh)"
          echo "path=$archive" >> "$GITHUB_OUTPUT"

      - name: Save package archive
        uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: ${{ steps.archive.outputs.path }}
          if-no-files-found: error

      - name: Publish the tagged package
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          NPM_PUBLISH_FLAGS: --provenance
        run: bash .github/scripts/publish-package.sh
