[appearance]
pi.showCacheMissNotices = true
pi.theme = "tokyo-night"
pi.tuiMode = "fullscreen"
pi.fullscreenExitOutput = "resume-hint"
pi.terminal.showTerminalProgress = true
pi.terminal.showImages = true
pi.quietStartup = true
pi.markdown.codeBlockIndent = "  "
pi.markdown.mermaid = "streaming"
pi.showHardwareCursor = false
pi.editorPaddingX = 1
pi.outputPad = 1
pi.hideThinkingBlock = true
pi.collapseChangelog = true
pi-libtui.iconPack = "nerd-fonts"
pi-libtui.powerline = true
pi-libtui.powerlineButtons = true
pi-libtui.insertionCursor = "blinking-bar"
pi-libtui.navigationCursor = "blinking-block"
pi-libtui.selectionCursor = "blinking-block"
pi-custom-editor.statusSeparator = "powerline"
pi-custom-editor.leftRail = "off"
pi-custom-editor.rightRail = "off"
pi-developer-messages.auditEntries = []

[behavior]
pi.compaction.enabled = true
pi.compaction.reserveTokens = 16384
pi.compaction.keepRecentTokens = 20000
pi.branchSummary.skipPrompt = false
pi.enabledModels = [ "openai-codex/gpt-6-luna", "openai-codex/gpt-6-astra", "openai-codex/gpt-6.1-sol", "fireworks/accounts/fireworks/models/deepseek-v4p1-flash" ]
pi.retry.maxRetries = 5
pi-codex-native.fallbackCompaction = false
pi-context-windows.hybrid = true

[interaction]
pi.steeringMode = "one-at-a-time"

[tools]
pi.codemode.mode = "only"
pi.defaultTools = [ "new_context", "request_user_input_async", "send_message_to_user_async", "clock__sleep", "clock__curr_time", "image_gen__imagegen", "codemode", "skill", "web__run", "exec_command", "write_stdin", "tool_search", "apply_patch", "view_image", "get_context_remaining", "history__list_windows", "history__list_items", "history__read_item", "history__search_contents", "notes__list_files_by_prefix", "notes__read_file", "notes__search_contents", "notes__append_to_file", "notes__write_file" ]
