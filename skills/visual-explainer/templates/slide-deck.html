<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>[Deck subject]</title>
<style>
:root {
  --bg:Canvas; --surface:Canvas; --border:GrayText; --text:CanvasText; --text-dim:GrayText; --accent:LinkText;
  --ve-bg:var(--bg); --ve-surface:var(--surface); --ve-line:var(--border);
  --ve-text:var(--text); --ve-muted:var(--text-dim); --ve-accent:var(--accent);
  --ve-sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
* { box-sizing:border-box; }
html { color-scheme:light dark; scroll-snap-type:y mandatory; }
body { margin:0; background:var(--ve-bg); color:var(--ve-text); font:18px/1.45 var(--ve-sans); }
.slide { height:100dvh; overflow:hidden; scroll-snap-align:start; display:grid; align-content:center; padding:clamp(28px,6vh,64px) clamp(24px,7vw,88px); }
.slide__body { width:min(1120px,100%); margin:auto; }
.slide h1,.slide h2 { margin:0 0 16px; line-height:1.12; }
.slide h1 { font-size:clamp(34px,5vw,60px); }
.slide h2 { font-size:clamp(28px,4vw,44px); }
.deck-controls { position:fixed; right:14px; bottom:14px; display:flex; gap:4px; z-index:5; }
.deck-controls button { border:1px solid var(--ve-line); background:var(--ve-surface); color:var(--ve-text); padding:7px 10px; font:inherit; cursor:pointer; }
:focus-visible { outline:2px solid var(--ve-accent); outline-offset:2px; }
.slide[data-overflow=\"true\"] { outline:3px solid Mark; outline-offset:-3px; }
@media (max-height:700px), (max-width:700px) {
  .slide { overflow-y:auto; align-content:start; }
}
@media (prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } }
</style>
</head>
<body>
<main id="deck">
  <section class="slide" aria-labelledby="slide-1-title">
    <div class="slide__body">
      <h1 id="slide-1-title">[Slide mechanism, decision, or evidence]</h1>
      [Insert source-shaped slide content. Choose composition from the teaching job.]
    </div>
  </section>
  <!-- Add slides only when the teaching spine requires them; choose each composition independently. -->
</main>
<nav class="deck-controls" aria-label="Slide navigation">
  <button type="button" id="prev">Previous</button>
  <button type="button" id="next">Next</button>
</nav>
<script>
const slides=[...document.querySelectorAll('.slide')];
function validateSlideFit(){const bad=slides.filter(slide=>slide.scrollHeight>slide.clientHeight+1);bad.forEach(slide=>slide.dataset.overflow='true');if(bad.length)console.error(`${bad.length} slide(s) exceed 100dvh`);}
addEventListener('load',validateSlideFit);
let current=0;
function interactiveTarget(target){return Boolean(target.closest('a,button,input,select,textarea,summary,[contenteditable=\"true\"],[role=\"tab\"],[role=\"slider\"],[tabindex]:not(.slide)'));}
function show(index){current=Math.max(0,Math.min(slides.length-1,index));slides[current].scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}
document.querySelector('#prev').addEventListener('click',()=>show(current-1));
document.querySelector('#next').addEventListener('click',()=>show(current+1));
addEventListener('keydown',event=>{
  if(interactiveTarget(event.target))return;
  if(['ArrowRight','PageDown',' '].includes(event.key)){event.preventDefault();show(current+1);}
  else if(['ArrowLeft','PageUp'].includes(event.key)){event.preventDefault();show(current-1);}
  else if(event.key==='Home'){event.preventDefault();show(0);}
  else if(event.key==='End'){event.preventDefault();show(slides.length-1);}
});
const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting)current=slides.indexOf(entry.target);}),{threshold:.6});
slides.forEach(slide=>observer.observe(slide));
</script>
</body>
</html>
