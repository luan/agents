<!--
Architecture mechanics only. Select fragments conditionally and derive composition,
geometry, labels, and styling from the source. Bracketed text must be replaced.
-->
<style>
:root {
  --bg:Canvas; --surface:Canvas; --border:GrayText; --text:CanvasText; --text-dim:GrayText; --accent:LinkText;
  --ve-bg:var(--bg); --ve-surface:var(--surface); --ve-line:var(--border);
  --ve-text:var(--text); --ve-muted:var(--text-dim); --ve-accent:var(--accent);
  --ve-sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --ve-mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
* { box-sizing:border-box; }
.ve-topbar { position:sticky; top:0; z-index:20; min-height:52px; display:flex; align-items:center; justify-content:space-between; gap:20px; padding:0 24px; border-bottom:1px solid var(--ve-line); background:var(--ve-bg); }
.ve-topbar a { color:var(--ve-text); text-decoration:none; }
.ve-page-shell { width:min(100%,1480px); margin-inline:auto; display:grid; grid-template-columns:minmax(160px,220px) minmax(0,1fr); gap:clamp(24px,4vw,56px); padding:28px 32px 80px; }
.ve-toc-rail,.ve-page,.ve-page > * { min-width:0; }
.ve-toc { position:sticky; top:72px; max-height:calc(100dvh - 92px); overflow-y:auto; }
.ve-toc a { display:block; padding:6px 9px; border-left:2px solid transparent; color:var(--ve-muted); text-decoration:none; overflow-wrap:anywhere; }
.ve-toc a[aria-current="location"] { border-color:var(--ve-accent); color:var(--ve-text); }
.ve-page section[id] { scroll-margin-top:72px; }
.ve-flow-node,.ve-diagram-card,.ve-guided-layout > *,.ve-evidence-pair > * { min-width:0; }
.ve-flow-node,.ve-diagram-card { overflow-wrap:anywhere; }
.ve-reference-header { max-width:760px; }
.ve-reference-header h1 { margin:0 0 8px; font:700 26px/1.2 var(--ve-sans); }
.ve-reference-header p { margin:0; color:var(--ve-muted); font:14px/1.52 var(--ve-sans); }
.ve-step-controls { display:flex; gap:4px; margin:0 0 10px; padding:0; overflow:auto; list-style:none; }
.ve-step-controls button,.ve-tablist button { border:0; border-bottom:2px solid transparent; background:transparent; color:var(--ve-muted); padding:7px 9px; font:14px var(--ve-sans); cursor:pointer; white-space:nowrap; }
.ve-step-controls button[aria-current="step"],.ve-tablist button[aria-selected="true"] { border-color:var(--ve-accent); color:var(--ve-text); font-weight:700; }
.ve-guided-layout { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(250px,.6fr); gap:16px; align-items:start; }
.ve-diagram-slot { min-width:0; overflow:auto; border-block:1px solid var(--ve-line); }
.ve-step-detail,.ve-explanation { border-left:3px solid var(--ve-accent); padding-left:14px; }
.ve-evidence-pair { display:grid; grid-template-columns:minmax(240px,.8fr) minmax(0,1.2fr); gap:20px; align-items:start; }
.ve-code { min-width:0; border:1px solid #30363d; }
.ve-code header { padding:7px 10px; border-bottom:1px solid #30363d; background:#161b22; color:#9da7b3; font:12px var(--ve-mono); }
.ve-code pre { margin:0; padding:14px; overflow:auto; background:#0d1117; color:#e6edf3; font:12.5px/1.58 var(--ve-mono); white-space:pre; }
.ve-code .ve-line { display:block; min-height:1.58em; }
.ve-code .ve-comment { color:#8b949e; }
.ve-code .ve-keyword { color:#ff7b72; }
.ve-code .ve-type,.ve-code .ve-function { color:#d2a8ff; }
.ve-code .ve-string { color:#a5d6ff; }
.ve-code .ve-number { color:#79c0ff; }
.ve-linked-selection { display:grid; grid-template-columns:max-content minmax(0,1fr); gap:16px; border-block:1px solid var(--ve-line); }
.ve-tablist { padding:10px 10px 10px 0; border-right:1px solid var(--ve-line); }
.ve-tablist button { display:block; width:100%; text-align:left; }
.ve-tabpanel { padding:12px 0; }
.ve-tabpanel[hidden] { display:none; }
:focus-visible { outline:2px solid var(--ve-accent); outline-offset:2px; }
.ve-table-tools { display:flex; justify-content:flex-end; margin:0 0 10px; }
.ve-table-tools input { width:min(100%,360px); padding:8px 10px; border:1px solid var(--ve-line); background:var(--ve-surface); color:var(--ve-text); }
.ve-table-wrap { max-width:100%; overflow:auto; border:1px solid var(--ve-line); }
.ve-table { width:100%; border-collapse:collapse; font:13px/1.45 var(--ve-sans); }
.ve-table th,.ve-table td { padding:9px 11px; border-bottom:1px solid var(--ve-line); text-align:left; vertical-align:top; }
.ve-table th { position:sticky; top:0; background:var(--ve-bg); color:var(--ve-text); }
@media (max-width:760px) {
  .ve-guided-layout,.ve-evidence-pair,.ve-linked-selection { grid-template-columns:1fr; }
  .ve-tablist { display:flex; overflow:auto; border-right:0; border-bottom:1px solid var(--ve-line); }
  .ve-tablist button { width:auto; }
}
@media (max-width:820px) {
  .ve-topbar { padding-inline:14px; }
  .ve-page-shell { display:block; padding:18px 16px 64px; }
  .ve-toc-rail { position:sticky; top:52px; z-index:10; margin:0 -16px 20px; border-bottom:1px solid var(--ve-line); background:var(--ve-bg); }
  .ve-toc { position:static; display:flex; max-height:none; overflow-x:auto; padding-inline:10px; }
  .ve-toc a { flex:0 0 auto; white-space:nowrap; border-left:0; border-bottom:2px solid transparent; }
}
@media (prefers-reduced-motion:reduce) { * { transition:none!important; } }
</style>

<template id="navigation-shell-pattern">
  <header class="ve-topbar" data-ve-topbar>
    <a href="#top">[Short document identity]</a>
    <nav aria-label="Document"><a href="#[page-id]" aria-current="page">[Page]</a></nav>
  </header>
  <div id="top" class="ve-page-shell">
    <aside class="ve-toc-rail">
      <nav class="ve-toc" data-ve-toc aria-label="Page contents">
        <a href="#[section-id]">[Mechanism name]</a>
        <a href="#[section-id]">[Mechanism name]</a>
      </nav>
    </aside>
    <main class="ve-page">[Insert reference header and sections.]</main>
  </div>
</template>

<template id="reference-header-pattern">
  <header class="ve-reference-header">
    <h1>[Exact subject]</h1>
    <p>[Explain the governing mechanism and a behavior it predicts.]</p>
  </header>
</template>

<template id="guided-view-pattern">
  <section aria-labelledby="[mechanism-heading-id]">
    <h2 id="[mechanism-heading-id]">[Mechanism name]</h2>
    <ol class="ve-step-controls" aria-label="[Walkthrough name]">
      <li><button data-step="0" aria-current="step" aria-controls="[stage-id] [detail-id]" tabindex="0">[Step label]</button></li>
      <li><button data-step="1" aria-controls="[stage-id] [detail-id]" tabindex="-1">[Step label]</button></li>
    </ol>
    <div class="ve-guided-layout">
      <div id="[stage-id]" class="ve-diagram-slot">[Insert source-shaped visual whose elements map to ledger steps.]</div>
      <aside id="[detail-id]" class="ve-step-detail" aria-live="polite">
        <h3 data-step-title>[Current mechanism]</h3>
        <div data-step-copy>[Explain the new relationship and its consequence.]</div>
      </aside>
    </div>
  </section>
</template>

<template id="evidence-pair-pattern">
  <div class="ve-evidence-pair">
    <div class="ve-explanation">[Mechanism explanation]</div>
    <div class="ve-code"><header>[Exact path and symbol, or simplified label]</header><pre><code><span class="ve-line">[Shiki-rendered HTML, or escaped code using ve-comment, ve-keyword, ve-type, ve-function, ve-string, and ve-number spans]</span></code></pre></div>
  </div>
</template>

<template id="linked-selection-pattern">
  <div class="ve-linked-selection">
    <div class="ve-tablist" role="tablist" aria-label="[Selectable relationship]">
      <button id="[tab-a]" role="tab" aria-selected="true" aria-controls="[panel-a]" tabindex="0">[A]</button>
      <button id="[tab-b]" role="tab" aria-selected="false" aria-controls="[panel-b]" tabindex="-1">[B]</button>
    </div>
    <div>
      <section id="[panel-a]" class="ve-tabpanel" role="tabpanel" aria-labelledby="[tab-a]">[Source-grounded detail]</section>
      <section id="[panel-b]" class="ve-tabpanel" role="tabpanel" aria-labelledby="[tab-b]" hidden>[Source-grounded detail]</section>
    </div>
  </div>
</template>

<template id="filterable-table-pattern">
  <section aria-labelledby="[inventory-heading-id]">
    <h2 id="[inventory-heading-id]">[Inventory name]</h2>
    <div class="ve-table-tools"><label>[Filter label] <input type="search" data-ve-filter placeholder="[Source-native examples]"></label></div>
    <div class="ve-table-wrap">
      <table class="ve-table" data-ve-table>
        <thead><tr><th>[Column]</th><th>[Column]</th><th>[Column]</th></tr></thead>
        <tbody><tr><td>[Source-native item]</td><td>[Role]</td><td>[Interaction]</td></tr></tbody>
      </table>
    </div>
  </section>
</template>

<script>
function initVeStepper(root, steps) {
  const buttons=[...root.querySelectorAll('[data-step]')];
  const title=root.querySelector('[data-step-title]');
  const copy=root.querySelector('[data-step-copy]');
  function show(index,focus=false){
    buttons.forEach(button=>{const selected=Number(button.dataset.step)===index;button.toggleAttribute('aria-current',selected);button.tabIndex=selected?0:-1;});
    root.querySelectorAll('[data-enter-step]').forEach(element=>{const enters=Number(element.dataset.enterStep);element.hidden=enters>index;element.classList.toggle('learned',enters<index);element.classList.toggle('current',enters===index);});
    title.textContent=steps[index].title;copy.textContent=steps[index].copy;if(focus)buttons[index].focus();
  }
  buttons.forEach((button,index)=>{button.addEventListener('click',()=>show(index));button.addEventListener('keydown',event=>{const offsets={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1};let next=index;if(event.key in offsets)next=(index+offsets[event.key]+buttons.length)%buttons.length;else if(event.key==='Home')next=0;else if(event.key==='End')next=buttons.length-1;else return;event.preventDefault();show(next,true);});});
  show(0);
}

function initVeTabs(root) {
  const tabs=[...root.querySelectorAll('[role="tab"]')];
  function select(tab,focus=false){tabs.forEach(item=>{const selected=item===tab;item.setAttribute('aria-selected',String(selected));item.tabIndex=selected?0:-1;document.getElementById(item.getAttribute('aria-controls')).hidden=!selected;});if(focus)tab.focus();}
  tabs.forEach((tab,index)=>{tab.addEventListener('click',()=>select(tab));tab.addEventListener('keydown',event=>{const offsets={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1};let next=index;if(event.key in offsets)next=(index+offsets[event.key]+tabs.length)%tabs.length;else if(event.key==='Home')next=0;else if(event.key==='End')next=tabs.length-1;else return;event.preventDefault();select(tabs[next],true);});});
}

function initVeFilter(root) {
  const input=root.querySelector('[data-ve-filter]');
  const rows=[...root.querySelectorAll('[data-ve-table] tbody tr')];
  if(!input)return;
  input.addEventListener('input',()=>{
    const query=input.value.trim().toLowerCase();
    rows.forEach(row=>{row.hidden=query&&!row.textContent.toLowerCase().includes(query);});
  });
}

function initVeToc(root=document) {
  const links=[...root.querySelectorAll('[data-ve-toc] a')];
  const sections=links.map(link=>root.querySelector(link.getAttribute('href'))).filter(Boolean);
  const observer=new IntersectionObserver(entries=>{
    const visible=entries.filter(entry=>entry.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top)[0];
    if(!visible)return;
    links.forEach(link=>{const current=link.getAttribute('href')===`#${visible.target.id}`;link.toggleAttribute('aria-current',current);if(current)link.setAttribute('aria-current','location');});
  },{rootMargin:'-18% 0px -72%'});
  sections.forEach(section=>observer.observe(section));
}
</script>
