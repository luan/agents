<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>[Diagram subject]</title>
<style>
:root {
  --bg:Canvas; --surface:Canvas; --border:GrayText; --text:CanvasText; --text-dim:GrayText; --accent:LinkText;
  --ve-bg:var(--bg); --ve-surface:var(--surface); --ve-line:var(--border);
  --ve-text:var(--text); --ve-muted:var(--text-dim); --ve-accent:var(--accent);
  --ve-sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
* { box-sizing:border-box; }
html { color-scheme:light dark; }
body { margin:0; padding:28px; background:var(--ve-bg); color:var(--ve-text); font:14px/1.5 var(--ve-sans); }
main { max-width:1080px; margin:auto; }
header { max-width:760px; margin-bottom:18px; }
h1 { margin:0 0 8px; font-size:26px; }
p { margin:0 0 12px; }
.summary,.hint { color:var(--ve-muted); }
.diagram-shell { border-block:1px solid var(--ve-line); }
.diagram-head { display:flex; justify-content:space-between; gap:12px; align-items:center; padding:8px 0; }
.hint { margin:0; font-size:12px; }
.controls { display:flex; gap:3px; }
.controls button { min-width:34px; border:1px solid var(--ve-line); background:var(--ve-surface); color:var(--ve-text); padding:6px 8px; font:inherit; cursor:pointer; }
.viewport { height:min(68dvh,720px); min-height:360px; overflow:hidden; background:var(--ve-surface); touch-action:pan-y; }
.viewport.is-pannable { touch-action:none; }
.canvas { width:max-content; min-width:100%; transform-origin:0 0; }
.canvas svg { display:block; max-width:none; height:auto; }
:focus-visible { outline:2px solid var(--ve-accent); outline-offset:2px; }
@media (max-width:640px) { body { padding:18px; } .diagram-head { align-items:flex-start; } }
</style>
</head>
<body>
<main>
<header>
  <h1>[Exact diagram subject]</h1>
  <p class="summary">[Explain the relationship shown and a behavior it predicts.]</p>
</header>
<section class="diagram-shell" aria-labelledby="diagram-help">
  <div class="diagram-head">
    <p id="diagram-help" class="hint">Ctrl/Cmd + wheel to zoom. Drag or use arrow keys to pan when content exceeds the viewport.</p>
    <div class="controls" aria-label="Diagram controls">
      <button type="button" data-action="in" aria-label="Zoom in">+</button>
      <button type="button" data-action="out" aria-label="Zoom out">−</button>
      <button type="button" data-action="fit">Fit</button>
      <button type="button" data-action="one">1:1</button>
    </div>
  </div>
  <div class="viewport" role="region" aria-label="[Diagram subject]" tabindex="0">
    <div class="canvas">
      <svg viewBox="0 0 720 300" role="img" aria-labelledby="svg-title svg-desc">
        <title id="svg-title">[Diagram subject]</title>
        <desc id="svg-desc">[Complete textual description of nodes, labeled branches, and outcomes.]</desc>
        [Insert source-shaped SVG geometry.]
      </svg>
    </div>
  </div>
</section>
</main>
<script>
const viewport=document.querySelector('.viewport');
const canvas=document.querySelector('.canvas');
let scale=1,x=0,y=0,drag=null;
function canPan(){const box=canvas.querySelector('svg').viewBox.baseVal;return box.width*scale>viewport.clientWidth||box.height*scale>viewport.clientHeight;}
function apply(){canvas.style.transform=`translate(${x}px,${y}px) scale(${scale})`;viewport.classList.toggle('is-pannable',canPan());}
function fit(){const box=canvas.querySelector('svg').viewBox.baseVal;scale=Math.min((viewport.clientWidth-24)/box.width,(viewport.clientHeight-24)/box.height,1.5);x=(viewport.clientWidth-box.width*scale)/2;y=(viewport.clientHeight-box.height*scale)/2;apply();}
function zoom(delta,cx=viewport.clientWidth/2,cy=viewport.clientHeight/2){const next=Math.max(.2,Math.min(5,scale+delta));x=cx-(cx-x)*(next/scale);y=cy-(cy-y)*(next/scale);scale=next;apply();}
document.querySelector('[data-action="in"]').addEventListener('click',()=>zoom(.15));
document.querySelector('[data-action="out"]').addEventListener('click',()=>zoom(-.15));
document.querySelector('[data-action="fit"]').addEventListener('click',fit);
document.querySelector('[data-action="one"]').addEventListener('click',()=>{scale=1;x=0;y=0;apply();});
viewport.addEventListener('wheel',event=>{if(!(event.ctrlKey||event.metaKey))return;event.preventDefault();const rect=viewport.getBoundingClientRect();zoom(event.deltaY<0?.12:-.12,event.clientX-rect.left,event.clientY-rect.top);},{passive:false});
viewport.addEventListener('pointerdown',event=>{if(!canPan())return;drag={x:event.clientX,y:event.clientY,ox:x,oy:y};viewport.setPointerCapture(event.pointerId);});
viewport.addEventListener('pointermove',event=>{if(!drag)return;x=drag.ox+event.clientX-drag.x;y=drag.oy+event.clientY-drag.y;apply();});
viewport.addEventListener('pointerup',()=>drag=null);
viewport.addEventListener('keydown',event=>{if(!canPan())return;const amount=48;if(event.key==='ArrowLeft')x+=amount;else if(event.key==='ArrowRight')x-=amount;else if(event.key==='ArrowUp')y+=amount;else if(event.key==='ArrowDown')y-=amount;else return;event.preventDefault();apply();});
addEventListener('resize',fit);
requestAnimationFrame(fit);
</script>
</body>
</html>
